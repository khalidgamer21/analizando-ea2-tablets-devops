[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tablets-devops-ea2"
version = "2.0.0"
description = "Continuidad de EA1: catálogo de tablets con BeautifulSoup y CI/CD"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4==4.14.3", "pandas==3.0.1", "lxml==6.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["tablets_devops"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
